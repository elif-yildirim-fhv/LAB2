plugins {
    id 'java'
    id 'application'
    id 'com.google.protobuf' version '0.9.4'  // For gRPC
    id 'com.lightbend.akka.grpc.gradle' version '2.5.5'
}

group 'at.fhv.lab2'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        url "https://repo.akka.io/maven"
    }
    maven {
        url "https://plugins.gradle.org/m2/"
    }
}

dependencies {
    def akkaGrpcVersion = '2.5.5'
    def akkaVersion = '2.10.5'

    implementation "com.typesafe.akka:akka-actor_3:$akkaVersion"
    implementation "com.typesafe.akka:akka-actor-typed_3:$akkaVersion"
    implementation "com.typesafe.akka:akka-actor-testkit-typed_3:$akkaVersion"
    implementation "com.typesafe.akka:akka-stream_3:$akkaVersion"
    implementation 'com.lightbend.akka:akka-stream-alpakka-mqtt_3:9.0.1'
    implementation 'ch.qos.logback:logback-classic:1.5.18'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'io.grpc:grpc-netty-shaded:1.58.0'
    implementation 'io.grpc:grpc-protobuf:1.58.0'
    implementation 'io.grpc:grpc-stub:1.58.0'
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
    implementation "com.lightbend.akka.grpc:akka-grpc-runtime_3:${akkaGrpcVersion}"
    implementation "com.typesafe.akka:akka-http2-support_3:10.5.3"
    implementation "com.typesafe.akka:akka-http_3:10.5.3"
    implementation 'org.scala-lang:scala-library:2.13.15'
    implementation "io.grpc:grpc-netty-shaded:1.72.0"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
}
sourceSets {
    main {
        proto {
            sourceSets {'src/main/proto'}
        }
    }
}

processResources {
    exclude '**/*.proto'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.24.0"
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.58.0'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

application {
    mainClass = 'at.fhv.sysarch.lab2.HomeAutomationSystem'
}

run {
    standardInput = System.in
}

test {
    useJUnitPlatform()
}